# ============================================================
# THVote Vote 前端独立部署流水线
#
# 前后端解耦的核心实现：
#   1. SSH 到后端服务器，启动 backend 容器
#   2. 等待后端 /health 和 /graphql/schema 就绪
#   3. 本地运行 codegen（从后端获取 schema）
#   4. Docker 多阶段构建前端镜像
#   5. 推送到容器镜像仓库
#
# 触发条件：
#   - 推送代码到 zfq_dev_fe 分支（涉及 vote 包）
#   - 手动 workflow_dispatch
# ============================================================

name: Build & Deploy Vote Frontend

on:
  push:
    branches:
      - zfq_dev_fe
    paths:
      - '.github/workflows/navigator-image.yml'
      - '.github/workflows/result-image.yml'
      - '.github/workflows/vote-image.yml'
      - 'packages/vote/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - prod

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-vote
  # 后端服务地址（前端 codegen 从这里获取 schema）
  # 构建时由 workflow 根据环境注入
  # 注：实际由 backend-ready job 的 output 注入，此处仅作说明

jobs:
  # ==================== 获取后端服务就绪 ====================
  backend-ready:
    name: 确保后端服务就绪
    runs-on: ubuntu-latest
    outputs:
      backend-url: ${{ steps.backend-url.outputs.url }}
    steps:
      - name: 确定环境配置
        id: env
        run: |
          if [ "${{ github.event.inputs.environment || 'test' }}" == "prod" ]; then
            echo "server_host=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_key=${{ secrets.PROD_SERVER_SSH_KEY }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.PROD_SERVER_DIR || '/opt/thvote/prod' }}" >> $GITHUB_OUTPUT
            echo "backend_port=8000" >> $GITHUB_OUTPUT
          else
            echo "server_host=${{ secrets.TEST_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.TEST_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_key=${{ secrets.TEST_SERVER_SSH_KEY }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.TEST_SERVER_DIR || '/opt/thvote/test' }}" >> $GITHUB_OUTPUT
            echo "backend_port=8000" >> $GITHUB_OUTPUT
          fi
          echo "env=${{ github.event.inputs.environment || 'test' }}" >> $GITHUB_OUTPUT

      - name: 确保后端服务运行
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.env.outputs.server_host }}
          username: ${{ steps.env.outputs.server_user }}
          key: ${{ steps.env.outputs.server_key }}
          envs: SERVER_DIR,ENV
          script: |
            set -e
            SERVER_DIR="${{ steps.env.outputs.server_dir }}"
            echo "=== 确保后端服务运行 ==="
            echo "部署目录: $SERVER_DIR"
            cd "$SERVER_DIR"

            # 登录镜像仓库
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true

            # 如果 docker-compose.yml 不存在，退出（后端未部署）
            if [ ! -f docker-compose.yml ]; then
              echo "错误：后端 docker-compose.yml 不存在，请先部署后端"
              exit 1
            fi

            # 拉取最新后端镜像
            docker-compose pull backend || true

            # 确保后端启动（使用 backend profile）
            docker-compose up -d --profile backend

            echo "后端服务已启动/重启"

      - name: 等待后端健康检查
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.env.outputs.server_host }}
          username: ${{ steps.env.outputs.server_user }}
          key: ${{ steps.env.outputs.server_key }}
          envs: SERVER_DIR,BACKEND_PORT
          script: |
            set -e
            SERVER_DIR="${{ steps.env.outputs.server_dir }}"
            BACKEND_PORT="${{ steps.env.outputs.backend_port }}"
            cd "$SERVER_DIR"

            echo "=== 等待后端 /health 就绪 ==="
            for i in $(seq 1 60); do
              if docker-compose exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "后端 /health 检查通过"
                exit 0
              fi
              echo "等待后端启动... ($i/60)"
              sleep 3
            done
            echo "后端 /health 超时未通过，查看日志:"
            docker-compose logs backend | tail -30
            exit 1

      - name: 验证 GraphQL schema 端点
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.env.outputs.server_host }}
          username: ${{ steps.env.outputs.server_user }}
          key: ${{ steps.env.outputs.server_key }}
          envs: SERVER_DIR
          script: |
            set -e
            SERVER_DIR="${{ steps.env.outputs.server_dir }}"
            cd "$SERVER_DIR"

            echo "=== 验证 GraphQL schema 端点 ==="
            # 检查 /graphql/schema 端点（Strawberry 默认提供）
            SCHEMA_OUTPUT=$(docker-compose exec -T backend curl -sf http://localhost:8000/graphql/schema 2>&1 | head -c 200)
            if [ -n "$SCHEMA_OUTPUT" ]; then
              echo "GraphQL schema 端点正常"
              echo "Schema 预览: $SCHEMA_OUTPUT"
            else
              echo "警告：/graphql/schema 端点返回为空，尝试备用端点..."
              # Strawberry 可能需要通过 introspection 查询
              SCHEMA_CHECK=$(docker-compose exec -T backend curl -sf -X POST http://localhost:8000/graphql \
                -H "Content-Type: application/json" \
                -d '{"query":"{ __schema { queryType { name } } }"}' 2>&1)
              if echo "$SCHEMA_CHECK" | grep -q "queryType"; then
                echo "GraphQL introspection 正常"
              else
                echo "警告：无法获取 GraphQL schema"
              fi
            fi

      - name: 确定后端访问地址
        id: backend-url
        run: |
          if [ "${{ steps.env.outputs.env }}" == "prod" ]; then
            echo "url=http://${{ secrets.PROD_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          else
            echo "url=http://${{ secrets.TEST_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          fi

  # ==================== 构建前端镜像 ====================
  build:
    name: 构建前端镜像
    runs-on: ubuntu-latest
    needs: backend-ready
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Codegen（从后端获取 schema）
        env:
          GRAPHQL_SCHEMA_URL: ${{ needs.backend-ready.outputs.backend-url }}/graphql
        run: |
          echo "=== Codegen 从后端获取 schema ==="
          echo "Schema 地址: $GRAPHQL_SCHEMA_URL"

          # 验证后端可访问
          if ! curl -sf "$GRAPHQL_SCHEMA_URL" -o /dev/null 2>&1; then
            echo "错误：无法访问后端 GraphQL 端点"
            exit 1
          fi

          # 执行 codegen
          pnpm --filter @touhou-vote/vote run codegen

          # 验证生成的文件存在
          if [ -f packages/vote/src/graphql/__generated__/graphql.ts ]; then
            echo "Codegen 成功，生成文件存在"
          else
            echo "错误：Codegen 未生成预期文件"
            exit 1
          fi

      - name: 构建 Vote 应用
        run: pnpm --filter @touhou-vote/vote run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像版本
        id: meta
        run: |
          if [ "${{ github.event.inputs.environment || 'test' }}" == "prod" ]; then
            VERSION="prod-$(date +%Y%m%d)-$(echo '${{ github.sha }}' | cut -c1-7)"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="test-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="test-$(date +%Y%m%d)-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送 Vote 镜像
        run: |
          cd packages/vote/dist
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          PROD_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:prod"

          docker build -t $VERSION_TAG -t $TEST_TAG -t $PROD_TAG . << 'DOCKEREOF'
          FROM nginx:alpine
          RUN echo 'server { \
              listen 8082; \
              location / { \
                  root /usr/share/nginx/html; \
                  try_files $uri $uri/ /index.html; \
              } \
          }' > /etc/nginx/conf.d/default.conf
          EXPOSE 8082
          CMD ["nginx", "-g", "daemon off;"]
          COPY . /usr/share/nginx/html
          DOCKEREOF

          docker push $VERSION_TAG
          docker push $TEST_TAG
          docker push $PROD_TAG

      - name: 部署到目标服务器
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_HOST || secrets.TEST_SERVER_HOST }}
          username: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_USER || secrets.TEST_SERVER_USER }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: SERVER_DIR,ENV,VERSION_TAG
          script: |
            set -e
            ENV="${{ github.event.inputs.environment || 'test' }}"
            SERVER_DIR="${{ github.event.inputs.environment == 'prod' && vars.PROD_SERVER_DIR || vars.TEST_SERVER_DIR }}"
            VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            cd "$SERVER_DIR"

            echo "=== 更新前端镜像 ==="

            # 登录镜像仓库
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true

            # 拉取新镜像
            docker pull $VERSION_TAG

            # 如果 vote 服务配置不存在，先追加到 docker-compose.yml
            if ! grep -q "vote:" docker-compose.yml; then
              printf '\n  vote:\n    image: ${VOTE_IMAGE:-ghcr.io/patchyvideo/thvote-vote:test}\n    container_name: thvote-vote\n    restart: unless-stopped\n    ports:\n      - "8082:80"\n    networks:\n      - thvote-net\n    depends_on:\n      backend:\n        condition: service_healthy\n    profiles:\n      - frontend\n    healthcheck:\n      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 15s\n' >> docker-compose.yml
            fi

            # 更新 docker-compose.yml 中的镜像版本
            sed -i "s#image: 
              ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:.*#image: $VERSION_TAG#" docker-compose.yml

            # 重启前端服务（使用 frontend profile）
            docker-compose up -d --profile frontend --no-deps vote

            echo "Vote 前端部署完成"

      - name: 总结
        run: |
          echo "## Vote 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema 来源 | ${{ needs.backend-ready.outputs.backend-url }}/graphql |" >> $GITHUB_STEP_SUMMARY
