# ============================================================
# THVote Vote 前端独立部署流水线
#
# 流程：
#   1. 确定环境配置（env-setup job）
#   2. SSH 到后端服务器，启动 backend 容器（backend-ready job）
#   3. 等待后端 /health 和 GraphQL 就绪
#   4. 本地运行 codegen（从后端获取 schema）
#   5. Docker 构建前端镜像并推送到仓库
#   6. SSH 到目标服务器更新镜像
#
# 触发条件：
#   - 推送代码到 zfq_dev_fe 分支（涉及 vote 包）
#   - 手动 workflow_dispatch
# ============================================================

name: Build & Deploy Vote Frontend

on:
  push:
    branches:
      - zfq_dev_fe
    paths:
      - '.github/workflows/navigator-image.yml'
      - '.github/workflows/result-image.yml'
      - '.github/workflows/vote-image.yml'
      - 'packages/vote/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - prod

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-vote

jobs:
  # ==================== 确定环境配置 ====================
  env-setup:
    name: 确定环境配置
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env-detect.outputs.env }}
      server-dir: ${{ steps.env-detect.outputs.server_dir }}
      server-host: ${{ steps.env-detect.outputs.server_host }}
      server-user: ${{ steps.env-detect.outputs.server_user }}
    steps:
      - name: 检测环境
        id: env-detect
        run: |
          # workflow_dispatch 时用户选择了环境；推送时默认 test
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "server_host=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.PROD_SERVER_DIR || '/opt/thvote/prod' }}" >> $GITHUB_OUTPUT
          else
            echo "env=test" >> $GITHUB_OUTPUT
            echo "server_host=${{ secrets.TEST_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.TEST_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.TEST_SERVER_DIR || '/opt/thvote/test' }}" >> $GITHUB_OUTPUT
          fi

  # ==================== 确保后端就绪 ====================
  backend-ready:
    name: 确保后端服务就绪
    runs-on: ubuntu-latest
    needs: env-setup
    outputs:
      backend-url: ${{ steps.backend-url.outputs.url }}
    steps:
      - name: 确保后端服务运行
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server-host }}
          username: ${{ needs.env-setup.outputs.server-user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: SERVER_DIR,ENV
          script: |
            set -e
            SERVER_DIR="${{ needs.env-setup.outputs.server_dir }}"
            echo "=== 确保后端服务运行 ==="
            echo "部署目录: $SERVER_DIR"
            cd "$SERVER_DIR"

            # 登录镜像仓库
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true

            # 如果 docker-compose.yml 不存在，退出（后端未部署）
            if [ ! -f docker-compose.yml ]; then
              echo "错误：后端 docker-compose.yml 不存在，请先部署后端"
              exit 1
            fi

            # 拉取最新后端镜像
            docker-compose pull backend || true

            # 确保后端启动（使用 backend profile）
            docker-compose up -d --profile backend

            echo "后端服务已启动/重启"

      - name: 等待后端健康检查
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server-host }}
          username: ${{ needs.env-setup.outputs.server-user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: SERVER_DIR
          script: |
            set -e
            SERVER_DIR="${{ needs.env-setup.outputs.server_dir }}"
            cd "$SERVER_DIR"

            echo "=== 等待后端 /health 就绪 ==="
            for i in $(seq 1 60); do
              if docker-compose exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "后端 /health 检查通过"
                exit 0
              fi
              echo "等待后端启动... ($i/60)"
              sleep 3
            done
            echo "后端 /health 超时未通过，查看日志:"
            docker-compose logs backend | tail -30
            exit 1

      - name: 验证 GraphQL schema 端点
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server-host }}
          username: ${{ needs.env-setup.outputs.server-user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: SERVER_DIR
          script: |
            set -e
            SERVER_DIR="${{ needs.env-setup.outputs.server_dir }}"
            cd "$SERVER_DIR"

            echo "=== 验证 GraphQL schema 端点 ==="
            SCHEMA_OUTPUT=$(docker-compose exec -T backend curl -sf http://localhost:8000/graphql/schema 2>&1 | head -c 200)
            if [ -n "$SCHEMA_OUTPUT" ]; then
              echo "GraphQL schema 端点正常"
              echo "Schema 预览: $SCHEMA_OUTPUT"
            else
              echo "警告：/graphql/schema 端点返回为空，尝试备用端点..."
              SCHEMA_CHECK=$(docker-compose exec -T backend curl -sf -X POST http://localhost:8000/graphql \
                -H "Content-Type: application/json" \
                -d '{"query":"{ __schema { queryType { name } } }"}' 2>&1)
              if echo "$SCHEMA_CHECK" | grep -q "queryType"; then
                echo "GraphQL introspection 正常"
              else
                echo "警告：无法获取 GraphQL schema"
              fi
            fi

      - name: 确定后端访问地址
        id: backend-url
        run: |
          if [[ "${{ needs.env-setup.outputs.env }}" == "prod" ]]; then
            echo "url=http://${{ secrets.PROD_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          else
            echo "url=http://${{ secrets.TEST_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          fi

  # ==================== 构建前端镜像 ====================
  build:
    name: 构建前端镜像
    runs-on: ubuntu-latest
    needs: [env-setup, backend-ready]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Codegen（从后端获取 schema）
        env:
          GRAPHQL_SCHEMA_URL: ${{ needs.backend-ready.outputs.backend-url }}/graphql
        run: |
          echo "=== Codegen 从后端获取 schema ==="
          echo "Schema 地址: $GRAPHQL_SCHEMA_URL"

          # 验证后端可访问
          if ! curl -sf "$GRAPHQL_SCHEMA_URL" -o /dev/null 2>&1; then
            echo "错误：无法访问后端 GraphQL 端点"
            exit 1
          fi

          # 执行 codegen
          pnpm --filter @touhou-vote/vote run codegen

          # 验证生成的文件存在
          if [ -f packages/vote/src/graphql/__generated__/graphql.ts ]; then
            echo "Codegen 成功，生成文件存在"
          else
            echo "错误：Codegen 未生成预期文件"
            exit 1
          fi

      - name: 构建 Vote 应用
        run: pnpm --filter @touhou-vote/vote run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像版本
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            VERSION="prod-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="test-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="test-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像
        run: |
          cd packages/vote/dist
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          PROD_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:prod"

          docker build -t $VERSION_TAG -t $TEST_TAG -t $PROD_TAG . << 'DOCKEREOF'
          FROM nginx:alpine
          RUN echo 'server { \
              listen 8082; \
              location / { \
                  root /usr/share/nginx/html; \
                  try_files $uri $uri/ /index.html; \
              } \
          }' > /etc/nginx/conf.d/default.conf
          EXPOSE 8082
          CMD ["nginx", "-g", "daemon off;"]
          COPY . /usr/share/nginx/html
          DOCKEREOF
          docker push $VERSION_TAG
          docker push $TEST_TAG
          docker push $PROD_TAG

      - name: 部署到目标服务器
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'test' || github.event.inputs.environment == 'prod'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server-host }}
          username: ${{ needs.env-setup.outputs.server-user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: VERSION_TAG
          script: |
            set -e
            SERVER_DIR="${{ needs.env-setup.outputs.server_dir }}"
            VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            cd "$SERVER_DIR"

            echo "=== 更新 Vote 镜像 ==="

            # 登录镜像仓库
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true

            # 拉取新镜像
            docker pull $VERSION_TAG

            # 写入服务配置更新脚本
            cat > update_compose.py << 'PYEOF'
import yaml, sys
tag = sys.argv[1]

with open('docker-compose.yml') as f:
    doc = yaml.safe_load(f)

services = doc.setdefault('services', {})

NEW_SERVICE = {
    'image': tag,
    'container_name': 'thvote-vote',
    'restart': 'unless-stopped',
    'ports': ['8082:80'],
    'networks': ['thvote-net'],
    'depends_on': {'backend': {'condition': 'service_healthy'}},
    'profiles': ['frontend'],
    'healthcheck': {
        'test': ['CMD', 'wget', '--spider', '-q', 'http://localhost/'],
        'interval': '30s',
        'timeout': '10s',
        'retries': 3,
        'start_period': '15s',
    },
}

if 'vote' not in services:
    services['vote'] = NEW_SERVICE
else:
    services['vote']['image'] = tag

with open('docker-compose.yml', 'w') as f:
    yaml.dump(doc, f, default_flow_style=False, sort_keys=False)
PYEOF

            python3 update_compose.py "$VERSION_TAG"
            rm -f update_compose.py

            # 重启前端服务
            docker-compose up -d --profile frontend --no-deps vote

            echo "Vote 部署完成"

      - name: 总结
        run: |
          echo "## Vote 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 环境 | ${{ needs.env-setup.outputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema 来源 | ${{ needs.backend-ready.outputs.backend-url }}/graphql |" >> $GITHUB_STEP_SUMMARY
