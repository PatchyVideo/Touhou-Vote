# ============================================================
# THVote Vote 前端测试环境部署流水线
#
# 触发：push 到 zfq_dev_fe / dev 分支，或手动触发
# 流程：
#   1. 等待后端健康（直接 curl，无 SSH）
#   2. codegen（从后端拉 GraphQL schema）
#   3. 多阶段 Docker 构建（pnpm@10.33.0 + node:20）并推送镜像
#   4. SSH 部署到测试服务器
#
# 不影响生产流水线（vote-ci.yml 保持不变）
# ============================================================

name: Build & Deploy Vote Frontend

on:
  push:
    branches:
      - zfq_dev_fe
      - dev
    paths:
      - '.github/workflows/vote-image.yml'
      - 'Dockerfile.vote.template'
      - '.dockerignore'
      - 'docker/**'
      - 'packages/vote/**'
      - 'packages/shared/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-vote

jobs:
  build:
    name: 构建并部署 Vote 镜像
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 等待后端 GraphQL 就绪
        run: |
          GRAPHQL_URL="http://${{ secrets.TEST_SERVER_HOST }}:18000/graphql"
          echo "检查后端: $GRAPHQL_URL"
          for i in $(seq 1 20); do
            if curl -sf "$GRAPHQL_URL" -X POST \
              -H "Content-Type: application/json" \
              -d '{"query":"{ __typename }"}' | grep -q "__typename\|Query"; then
              echo "后端 GraphQL 就绪"
              exit 0
            fi
            echo "等待后端... ($i/20)"
            sleep 6
          done
          echo "后端 GraphQL 未就绪，终止"
          exit 1

      - name: 设置 pnpm（与生产 vote-ci.yml 一致：pnpm@10.33.0）
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 设置 Node.js（与生产 vote-ci.yml 一致：node 20）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Codegen（从测试后端获取 schema）
        env:
          GRAPHQL_SCHEMA_URL: "http://${{ secrets.TEST_SERVER_HOST }}:18000/graphql"
        run: |
          echo "Schema 地址: $GRAPHQL_SCHEMA_URL"
          pnpm --filter @touhou-vote/vote run codegen
          test -f packages/vote/src/graphql/__generated__/graphql.ts

      - name: 构建 Vote 应用（test mode）
        run: pnpm --filter @touhou-vote/vote run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像 tag
        id: meta
        run: |
          VERSION="test-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像（使用仓库 Dockerfile 模板）
        run: |
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          docker build \
            -t "$VERSION_TAG" \
            -t "$TEST_TAG" \
            -f Dockerfile.vote.template \
            --build-arg BACKEND_URL="http://${{ secrets.TEST_SERVER_HOST }}:18000" \
            .
          docker push "$VERSION_TAG"
          docker push "$TEST_TAG"

      - name: 上传 compose 模板到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "${{ vars.TEST_FRONTEND_SERVER_DIR || '/opt/thvote-fe/test' }}"
          strip_components: 1

      - name: 部署到测试服务器
        uses: appleboy/ssh-action@v1
        env:
          # 用本次构建的不可变版本 tag(非浮动 :test),保证部署的就是刚构建那个镜像
          VOTE_IMAGE: "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          envs: VOTE_IMAGE,REGISTRY,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            FRONTEND_DIR="${{ vars.TEST_FRONTEND_SERVER_DIR || '/opt/thvote-fe/test' }}"
            mkdir -p "$FRONTEND_DIR"
            cd "$FRONTEND_DIR"

            echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

            # 写入 .env（不覆盖其他服务的镜像配置）
            if [ ! -f .env ]; then
              {
                echo "VOTE_IMAGE=ghcr.io/patchyvideo/thvote-vote:test"
                echo "NAVIGATOR_IMAGE=ghcr.io/patchyvideo/thvote-navigator:test"
                echo "RESULT_IMAGE=ghcr.io/patchyvideo/thvote-result:test"
                echo "VOTE_PORT=8082"
                echo "NAVIGATOR_PORT=8083"
                echo "RESULT_PORT=8084"
              } > .env
            fi
            sed -i "s|^VOTE_IMAGE=.*|VOTE_IMAGE=${VOTE_IMAGE}|" .env

            # 拉镜像:最多 4 次重试兜那台机的网络抖动;仍失败则硬红(不静默用旧镜像)
            n=0; until docker pull "${VOTE_IMAGE}"; do n=$((n+1)); [ "$n" -ge 4 ] && { echo "镜像拉取失败,终止"; exit 1; }; echo "pull 重试 $n/4..."; sleep 6; done
            docker-compose up -d --no-deps --force-recreate vote
            docker image prune -f
            echo "Vote 部署完成，地址: http://localhost:8082"

      - name: 总结
        run: |
          echo "## Vote 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
