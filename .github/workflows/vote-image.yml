name: Vote Image Build
on:
  push:
    branches:
      - zfq_dev
    paths:
      - '.github/workflows/vote-image.yml'
      - 'packages/vote/**'
      - 'packages/shared/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/thvote-vote

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Codegen
        run: pnpm vote:codegen
        working-directory: ./packages/vote

      - name: Build
        run: pnpm vote:build:test
        working-directory: ./packages/vote

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="test-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="test-$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image
        run: |
          cd packages/vote/dist
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          
          docker build -t $TAG . << 'EOF'
          FROM nginx:alpine
          COPY . /usr/share/nginx/html
          RUN echo 'server { listen 8082; location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; } }' > /etc/nginx/conf.d/default.conf
          EXPOSE 8082
          CMD ["nginx", "-g", "daemon off;"]
          EOF
          
          docker push $TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Vote 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
