name: Probe Vercel deployments
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List deployment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?limit=100&projectId=$VERCEL_PROJECT_ID" \
            -o /tmp/deps.json
          jq -r '.deployments[]? | [.createdAt, .state, .url, (.meta.githubCommitRef // ""), (.meta.githubCommitSha // ""), (.meta.githubCommitMessage // "")] | @tsv' /tmp/deps.json | head -80
