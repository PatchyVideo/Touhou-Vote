name: Probe Vercel deployments
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List deployment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?limit=100" -o /tmp/deps.json
          jq -r '.deployments[]? | [.createdAt, .state, (.name // ""), .url, (.meta.githubCommitRef // ""), (.meta.githubCommitSha // ""), (.meta.githubCommitMessage // ""), (.blockedReason // ""), (.errorCode // ""), (.errorMessage // "")] | @tsv' /tmp/deps.json | head -80
          echo '--- first keys ---'
          jq -r '.deployments[0] | keys[]' /tmp/deps.json | head -40
