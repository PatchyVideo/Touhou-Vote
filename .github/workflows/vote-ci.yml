name: Vote CI
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/vote-ci.yml'
      - 'pnpm-lock.yaml'
      - 'packages/vote/**'

jobs:
  build:
    name: Build and Deploy to Vercel
    runs-on: ubuntu-22.04
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    if: github.repository == 'PatchyVideo/Touhou-Vote'
    environment: Vote-CI
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
        timeout-minutes: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          check-latest: true
        timeout-minutes: 10

      - name: Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
        timeout-minutes: 10

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: |
            - args: [--frozen-lockfile, --strict-peer-dependencies]
        timeout-minutes: 10

      - name: Codegen
        run: pnpm codegen
        working-directory: ./packages/vote
        timeout-minutes: 10

      - name: Build
        run: pnpm build
        working-directory: ./packages/vote
        timeout-minutes: 10

      # 其他人改动CI会导致部署失败，这里直接不携带Git信息
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf /tmp/vercel-site && mkdir -p /tmp/vercel-site
          cp -a packages/vote/dist/. /tmp/vercel-site/
          cd /tmp/vercel-site
          URL=$(npx vercel@latest deploy --prod --yes --no-wait --token="$VERCEL_TOKEN" | tail -n1)
          echo "Deployed: $URL"
          echo "### Vercel: $URL" >> "$GITHUB_STEP_SUMMARY"
          API="https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=1"
          for i in $(seq 1 50); do
            STATE=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "$API" | jq -r '.deployments[0].state // "unknown"')
            echo "[$i] ${STATE}"
            case "$STATE" in
              READY) exit 0 ;;
              BLOCKED|ERROR|CANCELED)
                echo "::error::Deployment state ${STATE}"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Deployment not ready after 8 minutes"
          exit 1
