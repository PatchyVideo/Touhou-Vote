name: Vote CI
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/vote-ci.yml'
      - 'pnpm-lock.yaml'
      - 'packages/vote/**'

jobs:
  build:
    name: Build and Deploy to Vercel
    runs-on: ubuntu-22.04
    if: github.repository == 'PatchyVideo/Touhou-Vote'
    environment: Vote-CI
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
        timeout-minutes: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          check-latest: true
        timeout-minutes: 10

      - name: Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
        timeout-minutes: 10

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: |
            - args: [--frozen-lockfile, --strict-peer-dependencies]
        timeout-minutes: 10

      - name: Codegen
        run: pnpm codegen
        working-directory: ./packages/vote
        timeout-minutes: 10

      - name: Build
        run: pnpm build
        working-directory: ./packages/vote
        timeout-minutes: 10

      # 其他人改动CI会导致部署失败，这里直接不携带Git信息
      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf /tmp/vercel-site && mkdir -p /tmp/vercel-site
          cp -a packages/vote/dist/. /tmp/vercel-site/
          cd /tmp/vercel-site
          URL=$(npx vercel@latest deploy --prod --yes --no-wait --token="$VERCEL_TOKEN" | tail -n1)
          case "$URL" in
            https://*.vercel.app*) ;;
            *) echo "::error::Unexpected deploy output: ${URL:0:200}"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment status
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        timeout-minutes: 10
        run: |
          set -uo pipefail
          HOST="${DEPLOY_URL#https://}"
          HOST="${HOST%%/*}"
          if [ -z "$HOST" ]; then
            echo "::error::Deployment URL was not produced"
            exit 1
          fi
          API="https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=20"
          for i in $(seq 1 50); do
            RESP=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "$API")
            if ! printf '%s' "$RESP" | jq -e . >/dev/null 2>&1; then
              echo "::error::Vercel API returned a non-JSON response"
              echo "${RESP:0:800}"
              exit 1
            fi
            if printf '%s' "$RESP" | jq -e 'has("error")' >/dev/null 2>&1; then
              echo "::error::Vercel API error"
              printf '%s\n' "$RESP" | jq -c '.error'
              exit 1
            fi
            STATE=$(printf '%s' "$RESP" | jq -r --arg h "$HOST" \
              '[.deployments[]? | select((.url | sub("^https?://"; "")) == $h)][0].state // "unknown"')
            echo "[$i] $HOST -> $STATE"
            if [ "$STATE" = "unknown" ] && [ "$i" -eq 1 ]; then
              echo "Newest deployment hosts: $(printf '%s' "$RESP" | jq -r '[.deployments[]? | .url][0:3] | join(", ")')"
            fi
            case "$STATE" in
              READY) exit 0 ;;
              BLOCKED|ERROR|CANCELED)
                printf '%s\n' "$RESP" | jq -c --arg h "$HOST" \
                  '[.deployments[]? | select((.url | sub("^https?://"; "")) == $h)][0]'
                echo "::error::Deployment state $STATE"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::warning::Deployment not ready after polling timeout (may still be queued): $DEPLOY_URL"
