# ============================================================
# THVote Result 前端独立部署流水线
#
# 流程：
#   1. 确定环境配置（env-setup job）
#   2. SSH 到后端服务器，启动 backend 容器（backend-ready job）
#   3. 等待后端 /health 和 GraphQL 就绪
#   4. 本地运行 codegen（从后端获取 schema）
#   5. Docker 构建前端镜像并推送到仓库
#   6. SSH 到目标服务器更新镜像
#
# 触发条件：
#   - 推送代码到 zfq_dev_fe 分支（涉及 result 包）
#   - 手动 workflow_dispatch
# ============================================================

name: Build & Deploy Result Frontend

on:
  push:
    branches:
      - zfq_dev_fe
    paths:
      - '.github/workflows/navigator-image.yml'
      - '.github/workflows/result-image.yml'
      - '.github/workflows/vote-image.yml'
      - 'packages/result/**'
      - 'packages/shared/**'
      - 'packages/result-codegen/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - prod

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-result

jobs:
  # ==================== 确定环境配置 ====================
  env-setup:
    name: 确定环境配置
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env-detect.outputs.env }}
      server_dir: ${{ steps.env-detect.outputs.server_dir }}
      server_host: ${{ steps.env-detect.outputs.server_host }}
      server_user: ${{ steps.env-detect.outputs.server_user }}
    steps:
      - name: 检测环境
        id: env-detect
        run: |
          # workflow_dispatch 时用户选择了环境；推送时默认 test
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "server_host=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.PROD_SERVER_DIR || '/opt/thvote/prod' }}" >> $GITHUB_OUTPUT
          else
            echo "env=test" >> $GITHUB_OUTPUT
            echo "server_host=${{ secrets.TEST_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.TEST_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.TEST_SERVER_DIR || '/opt/thvote/test' }}" >> $GITHUB_OUTPUT
          fi

  # ==================== 确保后端就绪 ====================
  backend-ready:
    name: 确保后端服务就绪
    runs-on: ubuntu-latest
    needs: env-setup
    outputs:
      backend-url: ${{ steps.backend-url.outputs.url }}
    steps:
      - name: 确保后端服务运行
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server_host }}
          username: ${{ needs.env-setup.outputs.server_user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: SERVER_DIR,ENV
          script: |
            set -e
            SERVER_DIR="${{ needs.env-setup.outputs.server_dir }}"
            cd "$SERVER_DIR"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true
            docker-compose pull backend || true
            docker-compose up -d --profile backend

      - name: 等待后端健康检查
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server_host }}
          username: ${{ needs.env-setup.outputs.server_user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: SERVER_DIR
          script: |
            set -e
            SERVER_DIR="${{ needs.env-setup.outputs.server_dir }}"
            cd "$SERVER_DIR"
            for i in $(seq 1 60); do
              if docker-compose exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "后端就绪"
                exit 0
              fi
              echo "等待后端... ($i/60)"
              sleep 3
            done
            echo "后端启动超时"
            docker-compose logs backend | tail -20
            exit 1

      - name: 确定后端地址
        id: backend-url
        run: |
          if [[ "${{ needs.env-setup.outputs.env }}" == "prod" ]]; then
            echo "url=http://${{ secrets.PROD_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          else
            echo "url=http://${{ secrets.TEST_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          fi

  # ==================== 构建 Result 镜像 ====================
  build:
    name: 构建 Result 镜像
    runs-on: ubuntu-latest
    needs: [env-setup, backend-ready]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Codegen（从后端获取 schema）
        env:
          GRAPHQL_SCHEMA_URL: ${{ needs.backend-ready.outputs.backend-url }}/graphql
        run: |
          echo "=== Codegen: schema from $GRAPHQL_SCHEMA_URL ==="
          if ! curl -sf "$GRAPHQL_SCHEMA_URL" -o /dev/null; then
            echo "无法访问后端 GraphQL 端点"
            exit 1
          fi
          pnpm --filter @touhou-vote/result run codegen

      - name: 构建 Result 应用
        run: pnpm --filter @touhou-vote/result run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像版本
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            VERSION="prod-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="test-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="test-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像
        run: |
          cd packages/result/dist
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          PROD_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:prod"
          docker build -t $VERSION_TAG -t $TEST_TAG -t $PROD_TAG . << 'DOCKEREOF'
          FROM nginx:alpine
          RUN echo 'server { \
              listen 8084; \
              location / { \
                  root /usr/share/nginx/html; \
                  try_files $uri $uri/ /index.html; \
              } \
          }' > /etc/nginx/conf.d/default.conf
          EXPOSE 8084
          CMD ["nginx", "-g", "daemon off;"]
          COPY . /usr/share/nginx/html
          DOCKEREOF
          docker push $VERSION_TAG
          docker push $TEST_TAG
          docker push $PROD_TAG

      - name: 部署到目标服务器
        if: >-
          (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'test' || github.event.inputs.environment == 'prod')
          && needs.env-setup.outputs.server_host != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server_host }}
          username: ${{ needs.env-setup.outputs.server_user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          envs: SERVER_DIR
          script: |
            set -e
            SERVER_DIR="${{ needs.env-setup.outputs.server_dir }}"
            cd "$SERVER_DIR"

            echo "=== 部署 Result ==="

            # 登录镜像仓库
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true

            # 拉起 / 重启 result（docker-compose 会自动拉取 :test 或 :prod tag）
            docker-compose up -d --profile frontend --no-deps result

            echo "Result 部署完成"

      - name: 总结
        run: |
          echo "## Result 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 环境 | ${{ needs.env-setup.outputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema 来源 | ${{ needs.backend-ready.outputs.backend-url }}/graphql |" >> $GITHUB_STEP_SUMMARY
