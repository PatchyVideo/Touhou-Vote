# ============================================================
# THVote Result 前端独立部署流水线
#
# Result 依赖 GraphQL，需要从后端获取 schema（与 Vote 相同流程）
# ============================================================

name: Build & Deploy Result Frontend

on:
  push:
    branches:
      - zfq_dev_fe
    paths:
      - '.github/workflows/result-image.yml'
      - 'packages/result/**'
      - 'packages/shared/**'
      - 'packages/result-codegen/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - prod

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-result

jobs:
  # ==================== 确保后端就绪 ====================
  backend-ready:
    name: 确保后端服务就绪
    runs-on: ubuntu-latest
    outputs:
      backend-url: ${{ steps.backend-url.outputs.url }}

    steps:
      - name: 确定环境配置
        id: env
        run: |
          if [ "${{ github.event.inputs.environment || 'test' }}" == "prod" ]; then
            echo "server_host=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_key=${{ secrets.PROD_SERVER_SSH_KEY }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.PROD_SERVER_DIR || '/opt/thvote/prod' }}" >> $GITHUB_OUTPUT
          else
            echo "server_host=${{ secrets.TEST_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.TEST_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "server_key=${{ secrets.TEST_SERVER_SSH_KEY }}" >> $GITHUB_OUTPUT
            echo "server_dir=${{ vars.TEST_SERVER_DIR || '/opt/thvote/test' }}" >> $GITHUB_OUTPUT
          fi

      - name: 确保后端服务运行
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.env.outputs.server_host }}
          username: ${{ steps.env.outputs.server_user }}
          key: ${{ steps.env.outputs.server_key }}
          envs: SERVER_DIR
          script: |
            set -e
            SERVER_DIR="${{ steps.env.outputs.server_dir }}"
            cd "$SERVER_DIR"
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true
            docker-compose pull backend || true
            docker-compose up -d --profile backend

      - name: 等待后端健康检查
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.env.outputs.server_host }}
          username: ${{ steps.env.outputs.server_user }}
          key: ${{ steps.env.outputs.server_key }}
          envs: SERVER_DIR
          script: |
            set -e
            SERVER_DIR="${{ steps.env.outputs.server_dir }}"
            cd "$SERVER_DIR"
            for i in $(seq 1 60); do
              if docker-compose exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "后端就绪"
                exit 0
              fi
              echo "等待后端... ($i/60)"
              sleep 3
            done
            echo "后端启动超时"
            docker-compose logs backend | tail -20
            exit 1

      - name: 确定后端地址
        id: backend-url
        run: |
          if [ "${{ github.event.inputs.environment || 'test' }}" == "prod" ]; then
            echo "url=http://${{ secrets.PROD_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          else
            echo "url=http://${{ secrets.TEST_SERVER_HOST }}:8000" >> $GITHUB_OUTPUT
          fi

  # ==================== 构建 Result 镜像 ====================
  build:
    name: 构建 Result 镜像
    runs-on: ubuntu-latest
    needs: backend-ready
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Codegen（从后端获取 schema）
        env:
          GRAPHQL_SCHEMA_URL: ${{ needs.backend-ready.outputs.backend-url }}/graphql
        run: |
          echo "=== Codegen: schema from $GRAPHQL_SCHEMA_URL ==="
          if ! curl -sf "$GRAPHQL_SCHEMA_URL" -o /dev/null; then
            echo "无法访问后端 GraphQL 端点"
            exit 1
          fi
          pnpm --filter @touhou-vote/result run codegen

      - name: 构建 Result 应用
        run: pnpm --filter @touhou-vote/result run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像版本
        id: meta
        run: |
          if [ "${{ github.event.inputs.environment || 'test' }}" == "prod" ]; then
            VERSION="prod-$(date +%Y%m%d)-$(echo '${{ github.sha }}' | cut -c1-7)"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="test-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="test-$(date +%Y%m%d)-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 写入 Docker 构建脚本
        run: |
          cat > docker-build.sh << 'SCRIPT'
          cd packages/result/dist
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          PROD_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:prod"
          docker build -t $VERSION_TAG -t $TEST_TAG -t $PROD_TAG . << 'DOCKEREOF'
          FROM nginx:alpine
          RUN echo 'server { \
              listen 8084; \
              location / { \
                  root /usr/share/nginx/html; \
                  try_files $uri $uri/ /index.html; \
              } \
          }' > /etc/nginx/conf.d/default.conf
          EXPOSE 8084
          CMD ["nginx", "-g", "daemon off;"]
          COPY . /usr/share/nginx/html
          DOCKEREOF
          docker push $VERSION_TAG
          docker push $TEST_TAG
          docker push $PROD_TAG
          SCRIPT

      - name: 构建并推送 Result 镜像
        run: bash docker-build.sh

      - name: 写入部署脚本
        run: |
          cat > deploy.sh << 'SCRIPT'
          set -e
          SERVER_DIR="${{ github.event.inputs.environment == 'prod' && vars.PROD_SERVER_DIR || vars.TEST_SERVER_DIR }}"
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          cd "$SERVER_DIR"
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true
          docker pull $VERSION_TAG
          if ! grep -q "result:" docker-compose.yml; then
            cat >> docker-compose.yml << 'COMPOSEEOF'

  result:
    image: ${RESULT_IMAGE:-ghcr.io/patchyvideo/thvote-result:test}
    container_name: thvote-result
    restart: unless-stopped
    ports:
      - "8084:80"
    networks:
      - thvote-net
    depends_on:
      vote:
        condition: service_healthy
    profiles:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
COMPOSEEOF
          fi
          sed -i "s#image: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:.*#image: $VERSION_TAG#" docker-compose.yml
          docker-compose up -d --profile frontend --no-deps result
          SCRIPT

      - name: 部署到目标服务器
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_HOST || secrets.TEST_SERVER_HOST }}
          username: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_USER || secrets.TEST_SERVER_USER }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          script: bash deploy.sh

      - name: 总结
        run: |
          echo "## Result 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema 来源 | ${{ needs.backend-ready.outputs.backend-url }}/graphql |" >> $GITHUB_STEP_SUMMARY
