# ============================================================
# THVote Navigator 前端独立部署流水线
#
# Navigator 不依赖 GraphQL，直接构建镜像
# ============================================================

name: Build & Deploy Navigator Frontend

on:
  push:
    branches:
      - zfq_dev_fe
    paths:
      - '.github/workflows/navigator-image.yml'
      - '.github/workflows/result-image.yml'
      - '.github/workflows/vote-image.yml'
      - 'packages/navigator/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - prod

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-navigator

jobs:
  build:
    name: 构建 Navigator 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Navigator 应用
        run: pnpm --filter @touhou-vote/navigator run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像版本
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            VERSION="prod-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="test-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="test-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 写入 Docker 构建脚本
        run: |
          cat > docker-build.sh << 'SCRIPT'
          cd packages/navigator/dist
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          PROD_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:prod"
          docker build -t $VERSION_TAG -t $TEST_TAG -t $PROD_TAG . << 'DOCKEREOF'
          FROM nginx:alpine
          RUN echo 'server { \
              listen 8083; \
              location / { \
                  root /usr/share/nginx/html; \
                  try_files $uri $uri/ /index.html; \
              } \
          }' > /etc/nginx/conf.d/default.conf
          EXPOSE 8083
          CMD ["nginx", "-g", "daemon off;"]
          COPY . /usr/share/nginx/html
          DOCKEREOF
          docker push $VERSION_TAG
          docker push $TEST_TAG
          docker push $PROD_TAG
          SCRIPT

      - name: 构建并推送Navigator 镜像
        run: bash docker-build.sh

      - name: 写入部署脚本
        run: |
          cat > deploy.sh << 'SCRIPT'
          set -e
          SERVER_DIR="${{ github.event.inputs.environment == 'prod' && vars.PROD_SERVER_DIR || vars.TEST_SERVER_DIR }}"
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          cd "$SERVER_DIR"
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true
          docker pull $VERSION_TAG
          if ! grep -q "navigator:" docker-compose.yml; then
            cat >> docker-compose.yml << 'COMPOSEEOF'

  navigator:
    image: ${NAVIGATOR_IMAGE:-ghcr.io/patchyvideo/thvote-navigator:test}
    container_name: thvote-navigator
    restart: unless-stopped
    ports:
      - "8083:80"
    networks:
      - thvote-net
    depends_on:
      vote:
        condition: service_healthy
    profiles:
      - frontend
    healthcheck:
      test:
        - CMD
        - wget
        - "--spider"
        - "-q"
        - "http://localhost/"
      interval: 30s
      timeout: 10s
      retries: 3
 COMPOSEEOF
          fi
          sed -i "s#image:
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:.*#image: $VERSION_TAG#" docker-compose.yml
          docker-compose up -d --profile frontend --no-deps navigator
          SCRIPT

      - name: 部署到目标服务器
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.environment != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_HOST || secrets.TEST_SERVER_HOST }}
          username: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_USER || secrets.TEST_SERVER_USER }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          script: bash deploy.sh

      - name: 总结
        run: |
          echo "## Navigator 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
