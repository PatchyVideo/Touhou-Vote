# ============================================================
# THVote Navigator 前端测试环境部署流水线
#
# Navigator 无 GraphQL 依赖，无需 codegen，无需等后端
# 触发：push 到 zfq_dev_fe / dev 分支，或手动触发
#
# 不影响生产流水线（navigator-ci.yml 保持不变）
# ============================================================

name: Build & Deploy Navigator Frontend

on:
  push:
    branches:
      - zfq_dev_fe
      - dev
    paths:
      - '.github/workflows/navigator-image.yml'
      - 'Dockerfile.navigator.template'
      - '.dockerignore'
      - 'docker/**'
      - 'packages/navigator/**'
      - 'packages/shared/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-navigator

# 三个前端共用同一台测试机的 Docker,串行部署,避免并发 docker pull 在 containerd
# 内容库上竞态(rename ... no such file)+ 并发 docker login 互相干扰(registry denied)
concurrency:
  group: frontend-test-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 构建并部署 Navigator 镜像
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm（与生产 navigator-ci.yml 一致：pnpm@10.33.0）
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 设置 Node.js（与生产 navigator-ci.yml 一致：node 20）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Navigator 应用（test mode）
        run: pnpm --filter @touhou-vote/navigator run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像 tag
        id: meta
        run: |
          VERSION="test-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像（使用仓库 Dockerfile 模板）
        run: |
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          docker build \
            -t "$VERSION_TAG" \
            -t "$TEST_TAG" \
            -f Dockerfile.navigator.template \
            .
          docker push "$VERSION_TAG"
          docker push "$TEST_TAG"

      - name: 上传 compose 模板到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "${{ vars.TEST_FRONTEND_SERVER_DIR || '/opt/thvote-fe/test' }}"
          strip_components: 1

      - name: 部署到测试服务器
        uses: appleboy/ssh-action@v1
        env:
          # 用本次构建的不可变版本 tag(非浮动 :test),保证部署的就是刚构建那个镜像
          NAVIGATOR_IMAGE: "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          envs: NAVIGATOR_IMAGE,REGISTRY,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            FRONTEND_DIR="${{ vars.TEST_FRONTEND_SERVER_DIR || '/opt/thvote-fe/test' }}"
            mkdir -p "$FRONTEND_DIR"
            cd "$FRONTEND_DIR"

            echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

            # 写入 .env（不覆盖其他服务的镜像配置）
            if [ ! -f .env ]; then
              {
                echo "VOTE_IMAGE=ghcr.io/patchyvideo/thvote-vote:test"
                echo "NAVIGATOR_IMAGE=ghcr.io/patchyvideo/thvote-navigator:test"
                echo "RESULT_IMAGE=ghcr.io/patchyvideo/thvote-result:test"
                echo "VOTE_PORT=8082"
                echo "NAVIGATOR_PORT=8083"
                echo "RESULT_PORT=8084"
              } > .env
            fi
            sed -i "s|^NAVIGATOR_IMAGE=.*|NAVIGATOR_IMAGE=${NAVIGATOR_IMAGE}|" .env

            # 拉镜像:最多 4 次重试兜那台机的网络抖动;仍失败则硬红(不静默用旧镜像)
            n=0; until docker pull "${NAVIGATOR_IMAGE}"; do n=$((n+1)); [ "$n" -ge 4 ] && { echo "镜像拉取失败,终止"; exit 1; }; echo "pull 重试 $n/4..."; sleep 6; done
            docker-compose up -d --no-deps --force-recreate navigator
            docker image prune -f
            echo "Navigator 部署完成，地址: http://localhost:8083"

      - name: 总结
        run: |
          echo "## Navigator 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
