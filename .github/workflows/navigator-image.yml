# ============================================================
# THVote Navigator 前端独立部署流水线
# ============================================================

name: Build & Deploy Navigator Frontend

on:
  push:
    branches:
      - zfq_dev_fe
    paths:
      - '.github/workflows/navigator-image.yml'
      - '.github/workflows/result-image.yml'
      - '.github/workflows/vote-image.yml'
      - 'docker/**'
      - 'packages/navigator/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - prod

env:
  REGISTRY: ghcr.io
  OWNER: patchyvideo
  IMAGE_NAME: thvote-navigator

jobs:
  env-setup:
    name: 确定环境配置
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env-detect.outputs.env }}
      frontend_dir: ${{ steps.env-detect.outputs.frontend_dir }}
      server_host: ${{ steps.env-detect.outputs.server_host }}
      server_user: ${{ steps.env-detect.outputs.server_user }}
    steps:
      - name: 检测环境
        id: env-detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "server_host=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "frontend_dir=${{ vars.PROD_FRONTEND_SERVER_DIR || '/opt/thvote-fe/prod' }}" >> $GITHUB_OUTPUT
          else
            echo "env=test" >> $GITHUB_OUTPUT
            echo "server_host=${{ secrets.TEST_SERVER_HOST }}" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.TEST_SERVER_USER }}" >> $GITHUB_OUTPUT
            echo "frontend_dir=${{ vars.TEST_FRONTEND_SERVER_DIR || '/opt/thvote-fe/test' }}" >> $GITHUB_OUTPUT
          fi

  build:
    name: 构建 Navigator 镜像
    runs-on: ubuntu-latest
    needs: env-setup
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7.33.7

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Navigator 应用
        run: pnpm --filter @touhou-vote/navigator run build -- --mode test

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像版本
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            VERSION="prod-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="test-$(date +%Y%m%d-%H%M%S)"
          else
            VERSION="test-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像
        run: |
          cd packages/navigator/dist
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          TEST_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:test"
          PROD_TAG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:prod"
          docker build -t $VERSION_TAG -t $TEST_TAG -t $PROD_TAG . << 'DOCKEREOF'
          FROM nginx:alpine
          RUN echo 'server { \
              listen 8083; \
              location / { \
                  root /usr/share/nginx/html; \
                  try_files $uri $uri/ /index.html; \
              } \
          }' > /etc/nginx/conf.d/default.conf
          EXPOSE 8083
          CMD ["nginx", "-g", "daemon off;"]
          COPY . /usr/share/nginx/html
          DOCKEREOF
          docker push $VERSION_TAG
          docker push $TEST_TAG
          docker push $PROD_TAG

      - name: 部署到目标服务器
        if: needs.env-setup.outputs.server_host != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ needs.env-setup.outputs.server_host }}
          username: ${{ needs.env-setup.outputs.server_user }}
          key: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SERVER_SSH_KEY || secrets.TEST_SERVER_SSH_KEY }}
          script: |
            set -e
            FRONTEND_DIR="${{ needs.env-setup.outputs.frontend_dir }}"
            mkdir -p "$FRONTEND_DIR"
            cd "$FRONTEND_DIR"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin || true

            cat > docker-compose.yml << 'COMPOSEEOF'
            version: "3.8"

            x-frontend-common: &frontend_common
              restart: unless-stopped
              networks:
                - thvote-net
              pull_policy: always

            services:
              vote:
                <<: *frontend_common
                image: ${VOTE_IMAGE:-ghcr.io/patchyvideo/thvote-vote:test}
                container_name: thvote-vote
                ports:
                  - "${VOTE_PORT:-8082}:8082"

              navigator:
                <<: *frontend_common
                image: ${NAVIGATOR_IMAGE:-ghcr.io/patchyvideo/thvote-navigator:test}
                container_name: thvote-navigator
                ports:
                  - "${NAVIGATOR_PORT:-8083}:8083"

              result:
                <<: *frontend_common
                image: ${RESULT_IMAGE:-ghcr.io/patchyvideo/thvote-result:test}
                container_name: thvote-result
                ports:
                  - "${RESULT_PORT:-8084}:8084"

            networks:
              thvote-net:
                name: thvote-net
                external: true
            COMPOSEEOF

            ENV_FILE=".env.${{ needs.env-setup.outputs.env }}"
            if [ ! -f "$ENV_FILE" ]; then
              cat > "$ENV_FILE" << 'ENVEOF'
            VOTE_IMAGE=ghcr.io/patchyvideo/thvote-vote:${{ needs.env-setup.outputs.env }}
            NAVIGATOR_IMAGE=ghcr.io/patchyvideo/thvote-navigator:${{ needs.env-setup.outputs.env }}
            RESULT_IMAGE=ghcr.io/patchyvideo/thvote-result:${{ needs.env-setup.outputs.env }}
            VOTE_PORT=8082
            NAVIGATOR_PORT=8083
            RESULT_PORT=8084
            ENVEOF
            fi

            cp "$ENV_FILE" .env
            sed -i.bak "s|^NAVIGATOR_IMAGE=.*|NAVIGATOR_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.env-setup.outputs.env }}|" .env
            rm -f .env.bak

            docker pull "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.env-setup.outputs.env }}" || true
            docker-compose up -d --no-deps navigator
            docker image prune -f

      - name: 总结
        run: |
          echo "## Navigator 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.meta.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 环境 | ${{ needs.env-setup.outputs.env }} |" >> $GITHUB_STEP_SUMMARY
